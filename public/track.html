<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>訂單查詢</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;800&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    .mode-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
    .mode-tabs button { flex: 1; }
    .mode-tabs button[aria-selected="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
    .results { display: grid; gap: 16px; margin: 20px 0 40px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container bar">
      <a class="brand" href="/" data-store-name>線上點餐</a>
      <nav class="site-nav">
        <a href="/">點餐</a>
        <a href="/track" class="active">訂單查詢</a>
      </nav>
    </div>
  </header>

  <main class="container narrow">
    <h1 style="margin:28px 0 14px">訂單查詢</h1>
    <div class="card">
      <div class="mode-tabs" role="tablist">
        <button type="button" class="btn" role="tab" aria-selected="true" data-mode="no">用訂單編號查詢</button>
        <button type="button" class="btn" role="tab" aria-selected="false" data-mode="phone">用電話查詢</button>
      </div>
      <form id="formNo">
        <div class="row">
          <div class="field">
            <label for="orderNo">訂單編號</label>
            <input type="text" id="orderNo" placeholder="例：20261014-0001" required>
          </div>
          <div class="field">
            <label for="contact">訂購人姓名或電話</label>
            <input type="text" id="contact" required>
          </div>
        </div>
        <button class="btn btn-primary" type="submit">查詢</button>
      </form>
      <form id="formPhone" class="hidden">
        <div class="field">
          <label for="phone">下單時填寫的電話</label>
          <input type="tel" id="phone" placeholder="0912-345-678" required>
        </div>
        <button class="btn btn-primary" type="submit">查詢</button>
        <p class="muted small" style="margin:10px 0 0">會列出此電話最近 20 筆訂單。</p>
      </form>
    </div>
    <div class="results" id="results"></div>
  </main>

  <script src="/assets/common.js"></script>
  <script>
    (function () {
      const { api, renderOrder, toast } = window.App;
      const results = document.getElementById('results');
      const params = new URLSearchParams(location.search);
      if (params.get('no')) document.getElementById('orderNo').value = params.get('no');

      api('/api/store').then((s) => {
        document.querySelectorAll('[data-store-name]').forEach((el) => { el.textContent = s.store_name; });
      }).catch(() => {});

      document.querySelectorAll('[data-mode]').forEach((tab) => tab.addEventListener('click', () => {
        document.querySelectorAll('[data-mode]').forEach((t) => t.setAttribute('aria-selected', String(t === tab)));
        document.getElementById('formNo').classList.toggle('hidden', tab.dataset.mode !== 'no');
        document.getElementById('formPhone').classList.toggle('hidden', tab.dataset.mode !== 'phone');
        results.innerHTML = '';
      }));

      async function search(query) {
        results.innerHTML = '<p class="empty">查詢中…</p>';
        try {
          const { orders } = await api('/api/orders/lookup?' + new URLSearchParams(query));
          results.innerHTML = orders.length
            ? orders.map((o) => `<div class="card">${renderOrder(o)}</div>`).join('')
            : '<div class="card empty">查無符合的訂單，請確認輸入資料是否正確。</div>';
        } catch (err) {
          results.innerHTML = '';
          toast(err.message, 'error');
        }
      }

      document.getElementById('formNo').addEventListener('submit', (e) => {
        e.preventDefault();
        search({ order_no: document.getElementById('orderNo').value.trim(),
          contact: document.getElementById('contact').value.trim() });
      });
      document.getElementById('formPhone').addEventListener('submit', (e) => {
        e.preventDefault();
        search({ phone: document.getElementById('phone').value.trim() });
      });
    })();
  </script>
</body>
</html>
