<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>線上訂餐｜選擇商家</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;800&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container bar">
      <a class="brand" href="/">線上訂餐</a>
      <nav class="site-nav">
        <a href="/" class="active">點餐</a>
        <a href="/track">訂單查詢</a>
        <a href="/admin/" class="nav-admin" id="adminLink">店家後台</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>選擇商家</h1>
      <p class="muted">先選一家商家，再挑選餐點。每張訂單只能包含同一家商家的餐點。</p>
    </div>
  </section>

  <main class="container">
    <div class="store-grid" id="stores"><p class="empty">載入中…</p></div>
  </main>

  <script src="/assets/common.js"></script>
  <script>
    (async function () {
      const { api, esc } = window.App;
      const box = document.getElementById('stores');
      try {
        const { stores, admin_url: adminUrl } = await api('/api/stores');
        if (adminUrl) document.getElementById('adminLink').href = adminUrl;
        box.innerHTML = stores.length ? stores.map((s) => `
          <a class="card store-card ${s.is_open ? '' : 'closed'}" href="/store?id=${s.id}">
            <div class="store-card-head">
              <h2>${esc(s.store_name)}</h2>
              <span class="open-pill ${s.is_open ? 'on' : 'off'}">${s.is_open ? '接單中' : '暫停接單'}</span>
            </div>
            ${s.store_description ? `<p class="muted">${esc(s.store_description)}</p>` : ''}
            <div class="store-card-meta small muted">
              ${s.business_hours ? `<span>營業時間：${esc(s.business_hours)}</span>` : ''}
              ${s.store_address ? `<span>地址：${esc(s.store_address)}</span>` : ''}
            </div>
            ${s.announcement ? `<div class="announcement">${esc(s.announcement)}</div>` : ''}
            <span class="store-card-cta">查看菜單 →</span>
          </a>`).join('') : '<p class="empty">目前沒有營業中的商家</p>';
      } catch (err) {
        box.innerHTML = `<p class="empty">商家載入失敗：${esc(err.message)}</p>`;
      }
    })();
  </script>
</body>
</html>
