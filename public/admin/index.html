<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>後台總覽</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;800&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body data-page="dashboard">
  <div class="admin-shell">
    <main class="admin-main">
      <div class="page-head">
        <div><button class="btn btn-sm menu-toggle" type="button">☰ 選單</button>
          <h1>今日總覽 <span class="muted small" id="today"></span></h1></div>
        <div class="toolbar">
          <span id="openPill" class="open-pill"></span>
          <button class="btn btn-sm" id="toggleOpen" type="button"></button>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><div class="label">今日訂單數</div><div class="value" id="sOrders">–</div></div>
        <div class="stat"><div class="label">今日營收</div><div class="value accent" id="sRevenue">–</div></div>
        <div class="stat"><div class="label">平均客單價</div><div class="value" id="sAvg">–</div></div>
        <div class="stat"><div class="label">待處理訂單</div><div class="value" id="sActive">–</div></div>
      </div>

      <div class="grid-2">
        <section class="card">
          <h2>最新訂單 <a class="small" href="/admin/orders" style="float:right;font-weight:600">全部訂單 →</a></h2>
          <div class="table-wrap"><table class="table">
            <thead><tr><th>編號</th><th>顧客</th><th class="num">金額</th><th>狀態</th></tr></thead>
            <tbody id="recent"></tbody>
          </table></div>
        </section>
        <section class="card">
          <h2>今日熱銷餐點 <a class="small" href="/admin/report" style="float:right;font-weight:600">銷售日報 →</a></h2>
          <div class="table-wrap"><table class="table">
            <thead><tr><th>餐點</th><th class="num">數量</th><th class="num">營收</th></tr></thead>
            <tbody id="top"></tbody>
          </table></div>
        </section>
      </div>
    </main>
  </div>
  <script src="/assets/common.js"></script>
  <script src="/admin/admin.js"></script>
  <script>
    (async function () {
      const { api, money, esc, statusBadge, toast } = App;
      if (!(await Admin.boot())) return;

      async function load() {
        const d = await api('/api/admin/dashboard');
        document.getElementById('today').textContent = d.today;
        document.getElementById('sOrders').textContent = d.order_count;
        document.getElementById('sRevenue').textContent = money(d.total_revenue);
        document.getElementById('sAvg').textContent = money(d.average_order_value);
        document.getElementById('sActive').textContent = Object.values(d.active).reduce((a, b) => a + b, 0);
        const pill = document.getElementById('openPill');
        pill.textContent = d.store_open ? '接單中' : '暫停接單';
        pill.className = 'open-pill ' + (d.store_open ? 'on' : 'off');
        const btn = document.getElementById('toggleOpen');
        btn.textContent = d.store_open ? '暫停接單' : '開始接單';
        btn.onclick = async () => {
          await api('/api/admin/store', { method: 'PUT', body: { is_open: !d.store_open } });
          toast(d.store_open ? '已暫停接單' : '已開始接單', 'success');
          load();
        };
        document.getElementById('recent').innerHTML = d.recent_orders.length ? d.recent_orders.map((o) => `
          <tr><td><a href="/admin/orders?open=${o.id}">${esc(o.order_no)}</a></td><td>${esc(o.customer_name)}</td>
          <td class="num">${money(o.total)}</td><td>${statusBadge(o.status, o.status_label)}</td></tr>`).join('')
          : '<tr><td colspan="4" class="empty">尚無訂單</td></tr>';
        document.getElementById('top').innerHTML = d.top_items.length ? d.top_items.map((i) => `
          <tr><td>${esc(i.name)}</td><td class="num">${i.quantity}</td><td class="num">${money(i.revenue)}</td></tr>`).join('')
          : '<tr><td colspan="3" class="empty">今日尚無銷售</td></tr>';
      }
      await load();
      setInterval(() => { load().catch(() => {}); Admin.refreshPendingCount(); }, 30000);
    })();
  </script>
</body>
</html>
